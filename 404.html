<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Lotus Yoga</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon.png" type="image/x-icon" />
  <style>
    :root { --ink: #121212; --muted: #5f5f68; --brand: #417572; --bg: #F2F0EC; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code { font-size: 14px; letter-spacing: .3em; color: var(--brand); margin: 0 0 12px; }
    h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 12px; line-height: 1.2; }
    p { color: var(--muted); margin: 0 auto 28px; max-width: 44ch; line-height: 1.7; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
    }
    a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page has moved on</h1>
    <p>The page you were looking for does not exist. It may have been renamed, or the link may be out of date.</p>
    <a class="btn" href="index.html">Back to the homepage</a>
  </main>
</body>
</html>
